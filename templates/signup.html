<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your CodeAlive account. Join developers worldwide in sharing and collaborating on code seamlessly." />
    <meta name="google-site-verification" content="ea83WnXtdNRmXKKzvfTx9xfJeVKtxGbNgeumq_eiRSk" />
    <meta name="google-site-verification" content="NLcoGDSaxNXHirIutPY2zIK0qpIR3pDcBgH8tvo_MeQ" />
    <meta name="keywords" content="code editor, collaborative coding, real-time coding, online IDE, CodeAlive, signup" />
    <meta property="og:title" content="Sign Up for CodeAlive | Create an Account" />
    <meta property="og:description" content="Create your CodeAlive account today." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codealive.onrender.com/signup" />
    <title>Sign Up for CodeAlive | Create an Account</title>
    <link rel="stylesheet" href="/static/css/theme.css?v=1.1" />
    <link rel="stylesheet" href="/static/css/home.css?v=1.1" />
    <link rel="stylesheet" href="/static/css/auth.css?v=1.1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SQXHZCDKRS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SQXHZCDKRS');
    </script>
  </head>
  <body class="auth-body">
    <div class="auth-glow-green"></div>
    <div class="auth-glow-blue"></div>

    <div class="auth-container">
      <div class="auth-header">
        <a href="/" class="auth-logo">
          <span class="logo-pulse"></span>
          Code<span class="logo-dim">Alive</span>
        </a>
        <h1 class="auth-title">Create <em>account.</em></h1>
      </div>

      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="auth-input" placeholder="pick_a_unique_name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="auth-input" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="auth-input" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Retype Password</label>
          <input type="password" id="confirmPassword" class="auth-input" placeholder="••••••••" required>
        </div>
        <button id="themeToggle" class="btn-ghost-sm" type="button" style="margin-top: 10px; width: fit-content; align-self: center; font-size: 16px; cursor: pointer;">🌓</button>
        <button type="submit" class="btn-primary auth-btn">Sign Up</button>
      </form>

      <div class="auth-links">
        <a href="/login?next={{ request.query_params.get('next', '') }}">Already have an account? <strong>Login</strong></a>
      </div>
    </div>

    <!-- ERROR BAR -->
    <div id="error-bar"></div>

    <script type="module" src="/static/theme.js"></script>
    <script type="module" src="/static/auth.js"></script>
  </body>
</html>
