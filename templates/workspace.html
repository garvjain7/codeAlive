<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Access your private CodeAlive workspace. View, organize, and manage your saved code snippets securely." />
    <meta name="google-site-verification" content="ea83WnXtdNRmXKKzvfTx9xfJeVKtxGbNgeumq_eiRSk" />
    <meta name="google-site-verification" content="NLcoGDSaxNXHirIutPY2zIK0qpIR3pDcBgH8tvo_MeQ" />
    <meta name="keywords" content="CodeAlive workspace, manage snippets, saved code" />
    <meta property="og:title" content="Your CodeAlive Workspace | Manage Snippets" />
    <meta property="og:description" content="Access your private CodeAlive workspace." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codealive.onrender.com/workspace" />
    <title>Your CodeAlive Workspace | Manage Snippets</title>
    <link rel="stylesheet" href="/static/css/theme.css?v=1.1">
    <link rel="stylesheet" href="/static/css/workspace.css?v=1.1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@700&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SQXHZCDKRS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SQXHZCDKRS');
    </script>
</head>
<body class="dark-theme">
    <!-- TOP NAVIGATION -->
    <nav id="top-nav">
        <div class="nav-left">
            <a href="/" class="logo">Code<span>Alive</span></a>
            <a href="/editor" class="btn-ghost-sm" style="margin-left: 20px; text-decoration: none;">Editor</a>
        </div>
        
        <div class="nav-center">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="workspaceSearch" placeholder="Search snippets by title or language...">
            </div>
        </div>

        <div class="nav-right">
            <div class="profile-container" id="profileToggle">
                <div class="avatar">
                    <span class="avatar-initial" id="avatarInitial">U</span>
                </div>
                <div class="dropdown-menu" id="profileDropdown">
                    <div class="dropdown-header">
                        <span class="user-email" id="userEmailDisplay">user@codealive.com</span>
                    </div>
                    <div class="dropdown-divider"></div>
                    <a href="/profile" class="dropdown-item">Profile Settings</a>
                    <button id="themeToggle" class="dropdown-item">Toggle Theme</button>
                    <div class="dropdown-divider"></div>
                    <a href="/auth/logout" class="dropdown-item logout">Logout</a>
                </div>
            </div>
            
            <button id="mobile-sidebar-toggle" class="btn-ghost-sm" style="display: none; padding: 8px; font-size: 20px;">☰</button>
        </div>
    </nav>

    <div class="workspace-layout">
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <a href="/editor" class="btn-new-snippet">+ New Snippet</a>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-group">
                    <div class="group-title">Workspace</div>
                    <div class="nav-tree">
                        <div class="tree-item active" data-view="created" id="nav-created">
                            <span class="tree-icon">👤</span>
                            <span class="tree-label">My Snippets</span>
                        </div>
                        <div class="tree-item" data-view="accessed" id="nav-accessed">
                            <span class="tree-icon">🔓</span>
                            <span class="tree-label">Accessed Snippets</span>
                        </div>
                        <div class="tree-item" data-view="files" id="nav-files">
                            <span class="tree-icon">📁</span>
                            <span class="tree-label">My Files</span>
                        </div>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- MAIN PANEL -->
        <main class="main-panel">
            <div class="panel-container">
                <!-- SECTION 1: INSIGHTS -->
                <header class="section-header">
                    <h1>Workspace Insights</h1>
                </header>
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <span class="stat-value" id="stat-total">--</span>
                        <span class="stat-label">Code Snippets</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="stat-files">--</span>
                        <span class="stat-label">Shared Files</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="stat-languages">--</span>
                        <span class="stat-label">Languages Used</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="stat-downloads">--</span>
                        <span class="stat-label">Total Downloads</span>
                    </div>
                </div>

                <!-- SECTION 2: QUICK ACTIONS -->
                <div class="quick-actions">
                    <a href="/editor" class="action-btn primary">+ New Snippet</a>
                    <a href="/import" class="action-btn">+ Import File</a>
                    <a href="/profile" class="action-btn">Manage Profile</a>
                </div>

                <!-- SECTION 3: TABS -->
                <div class="tab-row">
                    <button class="tab-btn active" data-tab="created" id="tab-created">My Snippets</button>
                    <button class="tab-btn" data-tab="accessed" id="tab-accessed">Accessed Snippets</button>
                    <button class="tab-btn" data-tab="files" id="tab-files">My Files</button>
                </div>

                <!-- SECTION 4: SNIPPET LIST -->
                <div class="snippet-list" id="snippetList">
                    <!-- Cards will be injected here via JS -->
                    <div class="list-loading">
                        <div class="spinner"></div>
                        <p>Fetching your snippets...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- TOAST -->
    <div id="toast"></div>

    <script type="module" src="/static/features/workspace/workspace.js?v=1.1"></script>
</body>
</html>
