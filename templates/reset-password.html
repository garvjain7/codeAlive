<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — CodeAlive</title>
    <link rel="stylesheet" href="/static/css/home.css" />
    <link rel="stylesheet" href="/static/css/auth.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet" />
  </head>
  <body class="auth-body">
    <div class="auth-glow-green"></div>
    <div class="auth-glow-blue"></div>

    <div class="auth-container">
      <div class="auth-header">
        <a href="/" class="auth-logo">
          <span class="logo-pulse"></span>
          Code<span class="logo-dim">Alive</span>
        </a>
        <h1 class="auth-title">New <em>password.</em></h1>
      </div>

      <form id="resetForm" class="auth-form">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="auth-input" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Retype Password</label>
          <input type="password" id="confirmPassword" class="auth-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary auth-btn">Reset Password</button>
      </form>

      <div id="error-bar"></div>
      <div id="toast">Copied!</div>
    </div>

    <script type="module" src="/static/auth.js"></script>
  </body>
</html>
